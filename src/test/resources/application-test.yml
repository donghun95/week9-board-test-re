spring:
  datasource:
    url: jdbc:h2:mem:week9test;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
  cache:
    type: simple

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
